<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="appaloosa horse">
  <defs>
    <linearGradient id="bg-appaloosa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6dccf"/>
      <stop offset="100%" stop-color="#c2a98a"/>
    </linearGradient>
    <radialGradient id="sheen-appaloosa" cx="0.4" cy="0.35" r="0.9">
      <stop offset="0%" stop-color="#f6e08a"/>
      <stop offset="55%" stop-color="#caa46a"/>
      <stop offset="100%" stop-color="#9c7820"/>
    </radialGradient>
    <clipPath id="body-appaloosa">
      <ellipse cx="210" cy="150" rx="78" ry="44"/>
    </clipPath>
  </defs>

  <rect width="400" height="250" fill="url(#bg-appaloosa)"/>
  <ellipse cx="200" cy="226" rx="150" ry="14" fill="#000" opacity="0.12"/>

  <g transform="translate(200 150) scale(1) translate(-200 -150)">
    <!-- shadow under belly -->
    <ellipse cx="210" cy="208" rx="90" ry="12" fill="#000" opacity="0.10"/>

    <!-- tail -->
    <path d="M 285 130 q 34 18 24 70 q -6 14 -16 18 q 8 -28 -2 -50 q -8 -18 -22 -30 Z" fill="#5a3c1e"/>

    <!-- back legs -->
    <rect x="248" y="178" width="16" height="44" rx="6" fill="#caa46a"/>
    <rect x="276" y="178" width="16" height="44" rx="6" fill="#caa46a"/>
    <!-- hooves -->
    <rect x="247" y="218" width="18" height="8" rx="3" fill="#2c2218"/>
    <rect x="275" y="218" width="18" height="8" rx="3" fill="#2c2218"/>

    <!-- front legs -->
    <rect x="148" y="178" width="16" height="44" rx="6" fill="#caa46a"/>
    <rect x="176" y="178" width="16" height="44" rx="6" fill="#caa46a"/>
    <rect x="147" y="218" width="18" height="8" rx="3" fill="#2c2218"/>
    <rect x="175" y="218" width="18" height="8" rx="3" fill="#2c2218"/>

    <!-- body -->
    <ellipse cx="210" cy="150" rx="78" ry="44" fill="#caa46a"/>
    
    
    <g fill="#3a2410" opacity="0.85" clip-path="url(#body-appaloosa)">
      <ellipse cx="180" cy="135" rx="9" ry="7"/>
      <ellipse cx="215" cy="150" rx="11" ry="8"/>
      <ellipse cx="245" cy="132" rx="8" ry="6"/>
      <ellipse cx="160" cy="158" rx="7" ry="6"/>
      <ellipse cx="200" cy="170" rx="10" ry="7"/>
      <ellipse cx="235" cy="165" rx="7" ry="6"/>
      <ellipse cx="265" cy="148" rx="6" ry="5"/>
    </g>

    <!-- chest/neck -->
    <path d="M 150 150 Q 120 150 108 110 Q 100 84 112 72 L 140 96 Q 152 120 168 132 Z" fill="#caa46a"/>

    <!-- head -->
    <path d="M 112 72 Q 96 70 88 88 Q 82 108 90 134 Q 94 142 104 140 L 116 100 Z" fill="#caa46a"/>
    

    <!-- muzzle -->
    <ellipse cx="92" cy="132" rx="11" ry="9" fill="#000" opacity="0.55"/>

    <!-- ears -->
    <path d="M 118 70 L 124 50 L 132 72 Z" fill="#caa46a"/>
    <path d="M 132 72 L 142 54 L 146 76 Z" fill="#caa46a"/>

    <!-- mane along the neck -->
    <path d="M 124 52 Q 150 70 168 118 Q 150 108 138 116 Q 132 84 118 70 Z" fill="#5a3c1e"/>
    

    <!-- forelock -->
    <path d="M 110 74 Q 100 84 96 98 Q 108 90 116 96 Z" fill="#5a3c1e"/>

    <!-- eye -->
    <circle cx="106" cy="100" r="3.4" fill="#1a120a"/>
    <circle cx="107" cy="99" r="1" fill="#fff" opacity="0.8"/>

    
  </g>
</svg>